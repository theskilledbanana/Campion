<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Portal | Unblocked Content</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        }
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: var(--font-sans);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500 p-2 rounded-xl shadow-lg shadow-cyan-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white tracking-tighter uppercase italic">
                        Media<span class="text-cyan-400">Vault</span>
                    </h1>
                    <p class="text-xs font-mono text-zinc-500 uppercase tracking-widest leading-none">Content Portal Alpha</p>
                </div>
            </div>

            <div class="flex flex-1 max-w-xl items-center relative">
                <svg class="absolute left-4 w-5 h-5 text-zinc-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search for a title..."
                    class="w-full bg-zinc-900/50 border border-zinc-800 rounded-2xl py-3 pl-12 pr-4 text-zinc-100 placeholder:text-zinc-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all font-medium"
                >
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full p-6 pb-20">
        <!-- Category Navigation -->
        <section id="categories-nav" class="mb-10 flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar">
            <div class="flex items-center gap-2 pr-4 border-r border-zinc-800 mr-2">
                <svg class="w-4 h-4 text-zinc-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                <span class="text-sm font-bold text-zinc-500 uppercase tracking-wider">Genres</span>
            </div>
            <!-- Categories will be injected here -->
        </section>

        <!-- Grid -->
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Items will be injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-900 py-10 px-6 mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <p class="text-zinc-600 text-sm font-medium">
                &copy; 2024 MediaVault Portal. Hand-curated simple web content.
            </p>
            <div class="flex items-center gap-6">
                <a href="#" class="text-zinc-500 hover:text-cyan-400 text-sm font-mono transition-colors">PRIVACY</a>
                <a href="#" class="text-zinc-500 hover:text-cyan-400 text-sm font-mono transition-colors">TERMS</a>
                <a href="#" class="text-zinc-500 hover:text-cyan-400 text-sm font-mono transition-colors">SUPPORT</a>
            </div>
        </div>
    </footer>

    <!-- Player Overlay (Hidden by default) -->
    <div id="player-overlay" class="fixed inset-0 z-50 bg-black/95 flex flex-col hidden">
        <header class="p-4 flex items-center justify-between border-b border-zinc-800 bg-zinc-950/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <button id="close-player" class="p-2 hover:bg-zinc-800 rounded-full transition-colors text-zinc-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <div>
                    <h2 id="player-title" class="text-xl font-bold text-white leading-tight"></h2>
                    <span id="player-category" class="text-xs font-mono text-cyan-400 uppercase tracking-widest"></span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="refresh-player" class="p-2 hover:bg-zinc-800 rounded-lg transition-colors text-zinc-400 hover:text-white flex items-center gap-2 text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    <span class="hidden sm:inline">Refresh</span>
                </button>
                <button id="fullscreen-player" class="p-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg transition-colors text-white flex items-center gap-2 text-sm font-bold shadow-lg shadow-cyan-900/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    <span class="hidden sm:inline">Fullscreen</span>
                </button>
            </div>
        </header>
        <div class="flex-1 relative bg-[#050505]">
            <iframe id="game-iframe" class="w-full h-full border-none" allow="fullscreen; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
    </div>

    <script src="src/main.js"></script>
</body>
</html>
